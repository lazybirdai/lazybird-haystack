name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The oldest supported Haystack and the latest one.
          - python: '3.10'
            haystack: 'haystack-ai==2.12.0'
          - python: '3.13'
            haystack: 'haystack-ai'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '${{ matrix.haystack }}' -e '.[test]'
      - run: pytest -q
