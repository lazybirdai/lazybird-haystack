[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazybird-haystack"
version = "0.1.0"
description = "Lazybird text to speech for Haystack: natural AI voices (MP3) in your pipelines and agents, 500+ voices in 150+ languages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lazybird", email = "elyssia@lazybird.app" }]
requires-python = ">=3.10"
keywords = ["haystack", "lazybird", "text-to-speech", "tts", "speech", "voiceover", "ai-voice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["haystack-ai>=2.12", "httpx"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-httpx"]

[project.urls]
Homepage = "https://www.lazybird.app/text-to-speech-api"
Documentation = "https://www.lazybird.app/docs/api-reference"
Source = "https://github.com/lazybirdai/lazybird-haystack"
Issues = "https://github.com/lazybirdai/lazybird-haystack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lazybird_haystack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
